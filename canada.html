<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map of Canada</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f6f8;
      color: #182c3a;
      font-family: system-ui, sans-serif;
    }
    main { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3rem); }
    p { margin: 0 0 24px; color: #486071; }
    iframe {
      display: block;
      width: 100%;
      height: 70vh;
      min-height: 320px;
      border: 1px solid #ccd7df;
      border-radius: 12px;
      background: #e2e9ed;
    }
    .map-link { display: inline-block; margin-top: 16px; color: #145b89; }
  </style>
</head>
<body>
  <main>
    <h1>Canada</h1>
    <p>Explore Canada from coast to coast. Drag the map to move around and use the zoom controls to take a closer look.</p>
    <iframe
      title="Interactive map of Canada"
      src="https://www.openstreetmap.org/export/embed.html?bbox=-142%2C41%2C-51%2C84&amp;layer=mapnik"
      allowfullscreen>
    </iframe>
    <a class="map-link" href="https://www.openstreetmap.org/#map=3/65.0/-96.5" target="_blank" rel="noopener noreferrer">View a larger map on OpenStreetMap</a>
  </main>
</body>
</html>
